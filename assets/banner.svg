<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambient-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-orb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulse-orb-2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes float-pill-1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float-pill-2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes stream-flow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .orb-1 { animation: pulse-orb 8s ease-in-out infinite; transform-origin: 300px 180px; }
    .orb-2 { animation: pulse-orb-2 10s ease-in-out infinite; transform-origin: 900px 180px; }
    .stream-line { stroke-dasharray: 40, 20; animation: stream-flow 25s linear infinite; }
    .stream-line-rev { stroke-dasharray: 50, 25; animation: stream-flow 20s linear infinite reverse; }
    .pill-up { animation: float-pill-1 5s ease-in-out infinite; }
    .pill-down { animation: float-pill-2 6s ease-in-out infinite; }
    .term-cursor { animation: cursor-blink 1s infinite; }
    
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#tech-grid)" rx="16" />

  <!-- Animated Ambient Light Orbs (Background) -->
  <g>
    <circle class="orb-1" cx="280" cy="170" r="160" fill="#38bdf8" filter="url(#ambient-glow)" />
    <circle class="orb-2" cx="920" cy="190" r="180" fill="#8b5cf6" filter="url(#ambient-glow)" />
    <circle cx="600" cy="180" r="140" fill="#ec4899" opacity="0.15" filter="url(#ambient-glow)" />
  </g>

  <!-- Dynamic Vector Circuit & Code Flow Lines (Background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50,60 Q 300,120 600,40 T 1250,70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line-rev" d="M -50,300 Q 350,220 700,310 T 1250,270" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="stream-line" d="M 100,360 L 300,280 L 900,280 L 1100,360" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Dynamic Pill Badges (Middle Layer, Floating gently on outer sides) -->
  <g class="pill-up font-mono" opacity="0.85">
    <!-- Top Left Pill -->
    <rect x="70" y="45" width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="137" y="66" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle">⚡ Zero Latency</text>
  </g>
  <g class="pill-down font-mono" opacity="0.85">
    <!-- Bottom Left Pill -->
    <rect x="85" y="275" width="145" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="157" y="296" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">⌨️ Modal Editing</text>
  </g>
  <g class="pill-down font-mono" opacity="0.85">
    <!-- Top Right Pill -->
    <rect x="990" y="45" width="145" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="1062" y="66" fill="#d8b4fe" font-size="12" font-weight="600" text-anchor="middle">🌳 LSP &amp; Tree-sitter</text>
  </g>
  <g class="pill-up font-mono" opacity="0.85">
    <!-- Bottom Right Pill -->
    <rect x="980" y="275" width="155" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="1057" y="296" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle">🚀 Rust • Lua • C++</text>
  </g>

  <!-- Foreground Terminal Emulation Bar (Above Glow, perfectly legible) -->
  <g transform="translate(420, 48)">
    <rect width="360" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="30" cy="16" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="44" cy="16" r="4.5" fill="#10b981" opacity="0.8" />
    <text class="font-mono" x="65" y="21" fill="#94a3b8" font-size="11.5">
      <tspan fill="#38bdf8">~</tspan> nvim . <tspan fill="#64748b">|</tspan> zed . <tspan fill="#64748b">|</tspan> code .<tspan class="term-cursor" fill="#38bdf8">_</tspan>
    </text>
  </g>

  <!-- FOREGROUND MAIN HEADINGS (Crisp, High Contrast, Prominent) -->
  <g class="font-sans">
    <!-- Editor Category Pill -->
    <g transform="translate(600, 122)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" opacity="0.9" />
      <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">THE CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="196" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#title-grad)" filter="url(#glow-light)">
      Awesome Text Editors
    </text>

    <!-- Subtitle -->
    <text x="600" y="238" text-anchor="middle" font-size="17" font-weight="400" fill="#e2e8f0" opacity="0.95" letter-spacing="0.2">
      From Ultra-Fast Modal Terminals to Extensible Modern IDEs &amp; SaaS Platforms
    </text>
  </g>

  <!-- Decorative Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.35" />
</svg>
